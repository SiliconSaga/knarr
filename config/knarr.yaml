server_name: knarr.local

secrets:
  discord_token: DISCORD_TOKEN
  github_token: GITHUB_TOKEN

users:
  admin: "@admin:knarr.local"
  knarr: "@knarr:knarr.local"
  router: "@knarr-router:knarr.local"
  bridge_bot: "@discordbot:knarr.local"

communities:
  - config/test.yaml

instances:
  - id: reddit-terasology
    platform: reddit
    access_path: api
    scope: community/terasology
    polling:
      interval_seconds: 21600
    platform_config:
      subreddit: Terasology
    target_room: social-watch
    # no credentials_ref — Reddit /new.json is anonymous

  - id: github-terasology
    platform: github
    access_path: api
    scope: community/terasology
    polling:
      interval_seconds: 21600
    platform_config:
      repos:
        - MovingBlocks/Terasology
    target_room: social-watch
    credentials_ref:
      secret_name: knarr-cred-community-terasology-gh-pat
      secret_key: GITHUB_TOKEN

publishers:
  # Phase A ships only destinations we already run. Meta surfaces are Phase C,
  # gated on developer-account verification.
  - id: mtl-matrix
    platform: matrix
    surface: room
    access_path: api
    scope: community/mtl
    target: "#social-watch:knarr.local"

  - id: mtl-discord
    platform: discord
    surface: channel
    access_path: bridge
    scope: community/mtl
    # A Matrix room that mautrix-discord bridges to a Discord channel.
    # Delivery is confirmed by Matrix, not by Discord — see the adapter
    # docstring for what the bridge cannot express.
    target: "#bridge-test:knarr.local"
