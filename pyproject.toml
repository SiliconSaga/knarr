[project]
name = "knarr"
version = "0.1.0"
description = "Knarr — Matrix integration hub, bridges, and message routing"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio>=0.24.0",
    "confluent-kafka>=2.6.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors (E), import sorting (I), pyupgrade (UP),
# bugbear (B). Add more selectively if/when reviewers ask.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line-length is enforced separately by formatter, not the linter
    "B008",  # Click decorators legitimately call functions in defaults
]
