[project]
name = "knarr"
version = "0.1.0"
description = "Knarr — Matrix integration hub, bridges, and message routing"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio>=0.24.0",
    "confluent-kafka>=2.6.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
