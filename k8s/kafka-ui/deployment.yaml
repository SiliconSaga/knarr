apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: knarr
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:v0.7.2
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "knarr"
            # Stable since mimir#18 — Strimzi resources are named after the
            # claim, so this no longer changes on every cluster rebuild. The
            # authoritative value is the claim's status.bootstrapServers.
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "knarr-kafka-kafka-bootstrap.kafka.svc:9092"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: knarr
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kafka-ui
  namespace: knarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kafka-ui.knarr.local`)
      kind: Rule
      services:
        - name: kafka-ui
          port: 8080
