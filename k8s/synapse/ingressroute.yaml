apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synapse
  namespace: knarr
spec:
  entryPoints:
    - web
  routes:
    # Primary: local hostname (requires /etc/hosts entry)
    - match: Host(`matrix.knarr.local`)
      kind: Rule
      services:
        - name: synapse
          port: 8008
    # Fallback: route Matrix API paths regardless of Host header.
    # Needed for Tailscale Serve and other proxies that don't preserve
    # the original Host. Safe on a private homeserver where Synapse is
    # the only HTTP service.
    - match: PathPrefix(`/_matrix`) || Path(`/health`)
      kind: Rule
      priority: 1
      services:
        - name: synapse
          port: 8008
