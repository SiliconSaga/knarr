apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synapse
  namespace: knarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`matrix.knarr.local`) || Host(`100.69.239.116`) || PathPrefix(`/_matrix`) || PathPrefix(`/health`)
      kind: Rule
      services:
        - name: synapse
          port: 8008
