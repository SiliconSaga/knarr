apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: knarr
data:
  # A TEMPLATE, not the final config. The Deployment's initContainer renders
  # this into an emptyDir at boot, substituting the __DB_*__ placeholders from
  # the DataService-published Secret (`synapse-dataservice`).
  #
  # Why: this file previously carried a live database password, in git, in a
  # public repo. It also hardcoded a per-app Percona cluster hostname that only
  # existed until the next teardown. Both problems disappear by reading the
  # Secret the operator already publishes.
  homeserver.yaml.tmpl: |
    server_name: "knarr.local"
    pid_file: "/data/homeserver.pid"
    listeners:
      - port: 8008
        tls: false
        type: http
        x_forwarded: true
        resources:
          - names: [client, federation]
            compress: false
    database:
      name: psycopg2
      # The shared cluster's databases inherit en_US.utf-8 from template1 and
      # Synapse wants C. Same workaround the dedicated cluster needed.
      allow_unsafe_locale: true
      args:
        user: "__DB_USER__"
        password: "__DB_PASSWORD__"
        database: "__DB_NAME__"
        host: "__DB_HOST__"
        port: "__DB_PORT__"
        # The shared cluster serves hostssl only; sslmode=disable is rejected
        # outright rather than quietly downgraded.
        sslmode: "require"
        cp_min: 2
        cp_max: 5
    signing_key_path: "/keys/signing.key"
    suppress_key_server_warning: true
    enable_registration: false
    registration_shared_secret: "dMxdYybanbwhOQZ5TjeJ3koWwRNZazcutTdYMMHDKKc"
    federation_domain_whitelist: []
    allow_public_rooms_over_federation: false
    media_store_path: "/data/media_store"
    log_config: "/config/log.yaml"
    report_stats: false
    trusted_key_servers: []
    app_service_config_files:
      - /bridges/discord/registration.yaml
    # Relaxed rate limits — private homeserver, no public exposure.
    # Defaults are tuned for public servers guarding against abuse, way too
    # aggressive for operational/testing flows with admin + bridge logins.
    rc_login:
      address:
        per_second: 10
        burst_count: 50
      account:
        per_second: 10
        burst_count: 50
      failed_attempts:
        per_second: 1
        burst_count: 10
    rc_message:
      per_second: 100
      burst_count: 200
    rc_admin_redaction:
      per_second: 100
      burst_count: 200

  log.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
    root:
      level: INFO
      handlers: [console]
